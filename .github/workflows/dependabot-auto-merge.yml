name: Dependabot auto-merge

# Queues Dependabot's daily `@email-utils/*` group to merge once the PR gate
# passes, so a fix in one package reaches its dependents without waiting on
# anyone. Major bumps are breaking, so they wait for a person, as does every
# other Dependabot PR.
#
# Also retitles a bump of vendored data, which the build inlines into the
# published package, from chore(deps-dev) to fix(data), so the squash commit
# cuts a release. dependabot.yml gives each of these a PR of its own.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge:
    name: auto-merge
    # The PR's author, not github.actor, which is whoever last pushed.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # merge the PR
      pull-requests: write # enable auto-merge on the PR
    steps:
      - name: Read the update
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.dependency-group == 'email-utils' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

  retitle-vendored-data:
    name: retitle vendored data
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.title, 'chore(deps-dev): bump tlds from ')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # edit the PR's title
    steps:
      - name: Retitle to fix(data)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api -X PATCH "repos/$REPO/pulls/$PR_NUMBER" \
            -f title="fix(data): ${TITLE#'chore(deps-dev): '}" --jq .title
