name: CodeQL

# Code scanning for the package source and its workflows. Findings appear
# under the repo's Security tab and as PR annotations; the analysis isn't a
# required check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    # Without it, each leg reports as `analyze (<language>)`.
    name: ${{ matrix.language }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the package
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        # Neither needs a build: CodeQL reads the TypeScript source and the
        # workflow files directly.
        language: [javascript-typescript, actions]
    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
