name: Scorecard

# OpenSSF Scorecard, published to the public API for the README badge and
# uploaded to the Security tab. Publishing only accepts a restricted
# workflow: no top-level or job-level `env` or `defaults`, an Ubuntu hosted
# runner, and only checkout, upload-artifact, upload-sarif, and scorecard
# steps. The default token reads rulesets, so no PAT is needed.
# https://github.com/ossf/scorecard-action#workflow-restrictions
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the package
      security-events: write # upload the results
      id-token: write # publish the results
    steps:
      - name: Check out the package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: results.sarif
          retention-days: 7

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
